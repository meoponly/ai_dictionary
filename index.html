<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dictionary</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%230284c7%22><path d=%22M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25%22/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --border-soft: #e2e8f0;
            --primary-blue: #2563eb;
            --font-display: 'Sora', -apple-system, sans-serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: flex-start;
            padding: 24px;
            box-sizing: border-box;
        }

        .navbar h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
            transition: opacity 0.15s ease;
        }

        .navbar h1:hover { opacity: 0.8; }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 40px;
            width: 100%;
            max-width: 1200px;
            padding: 0 24px 40px 24px;
            box-sizing: border-box;
            flex: 1;
        }

        .central-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 440px;
            width: 100%;
        }

        .welcome-phrase {
            font-family: var(--font-display);
            font-size: 1.55rem;
            color: #334155;
            text-align: center;
            margin-bottom: 36px;
            font-weight: 600;
            letter-spacing: -0.02em;
            max-width: 660px;
            line-height: 1.6;
        }

        .interactive-word {
            display: inline-block;
            cursor: pointer;
            border-bottom: 2px dashed currentColor;
            padding-bottom: 1px;
            font-weight: 700;
        }

        .c-blue { color: #2563eb; }
        .c-green { color: #16a34a; }
        .c-purple { color: #7c3aed; }
        .c-orange { color: #ea580c; }

        .tooltip {
            position: fixed;
            display: none;
            width: 270px;
            background-color: #0f172a;
            color: #ffffff;
            border-radius: 12px;
            padding: 14px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
            font-family: var(--font-sans);
            font-size: 0.85rem;
            line-height: 1.4;
            font-weight: 500;
            text-align: left;
            z-index: 9999;
            pointer-events: none;
        }

        .tooltip-title { font-weight: 700; font-size: 0.95rem; color: #38bdf8; margin-bottom: 2px; }
        .tooltip-pronounce { color: #cbd5e1; font-style: italic; margin-bottom: 6px; font-size: 0.8rem; }
        .tooltip-meaning { color: #facc15; font-weight: 600; margin-bottom: 4px; }

        /* Significantly Bigger, Prominent Centered Search Command Bar */
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 680px; /* Wider footprint */
            background: #ffffff;
            border: 1px solid var(--border-soft);
            border-radius: 24px; /* Slightly softer curvature */
            padding: 8px 12px 8px 20px; /* Expanded spacious padding */
            box-sizing: border-box;
            box-shadow: 0 6px 36px rgba(15, 23, 42, 0.03);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .search-wrapper input {
            flex: 1;
            border: none;
            outline: none;
            padding: 14px 0; /* Larger target height */
            font-family: inherit;
            font-size: 1.15rem; /* Larger typing size */
            color: var(--text-main);
            background: transparent;
        }

        /* Responsive Compact Input Utility Tools */
        .media-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-util-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #64748b;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .input-util-btn:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .input-util-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .logo-ai-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #475569;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .logo-ai-btn:hover {
            background: #f8fafc;
            color: var(--primary-blue);
            border-color: var(--border-soft);
        }

        .logo-ai-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .logo-ai-btn.pulsing { animation: textPulse 1.4s infinite ease-in-out; cursor: wait; border-color: #bbf7d0; color: #166534; background: #f0fdf4; }

        /* Active Recording State Accent Modifier */
        .input-util-btn.recording {
            color: #ef4444;
            background: #fef2f2;
            animation: textPulse 1s infinite ease-in-out;
        }

        /* Centered Camera Streaming Frame View Window */
        .camera-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }

        .camera-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border-soft);
        }

        #videoFeed {
            width: 100%;
            background: #0f172a;
            border-radius: 14px;
            transform: scaleX(-1); /* Flips camera horizontally for a natural mirror view */
        }

        .camera-btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .cam-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .cam-snap { background: #0f172a; color: white; }
        .cam-cancel { background: #f1f5f9; color: #475569; }

        .suggestions-box { width: 100%; max-width: 680px; margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
        .suggestion-title { font-size: 0.8rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; }
        .suggestion-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: #ffffff; border: 1px solid var(--border-soft); padding: 8px 14px; border-radius: 12px; font-size: 0.88rem; color: #475569; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
        .tag:hover { border-color: #cbd5e1; background: #f8fafc; color: var(--text-main); }

        .workspace-view { width: 100%; display: none; }
        .session-heading { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; }
        .session-title-tag { display: flex; align-items: center; gap: 8px; background: #ffffff; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-soft); }
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px; width: 100%; }
        .vocab-card { background: #ffffff; border: 1px solid var(--border-soft); border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: flex-start; opacity: 0; transform: translateY(12px); animation: cardEmerging 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .vocab-card:hover { border-color: #cbd5e1; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15, 23, 42, 0.03); transition: all 0.25s ease; }
        .word-info { display: flex; flex-direction: column; gap: 4px; flex: 1; padding-right: 12px; }
        .main-translation-row { font-size: 1.15rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
        .word-number { color: var(--text-muted); font-weight: 500; }
        .translation-text { color: #475569; font-weight: 600; }
        .pronunciation-row { font-size: 0.9rem; color: var(--primary-blue); font-weight: 600; margin-top: 1px; }
        .definition-row { font-size: 0.88rem; color: var(--text-muted); font-weight: 500; line-height: 1.4; margin-top: 6px; border-left: 2px solid #e2e8f0; padding-left: 8px; }

        .speak-btn { background-color: #f8fafc; border: 1px solid var(--border-soft); color: var(--accent-color); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; align-self: center; transition: all 0.2s; }
        .speak-btn:hover { background-color: var(--accent-color); color: #ffffff; border-color: var(--accent-color); }
        .speak-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .history-column { background: #ffffff; border: 1px solid var(--border-soft); border-radius: 20px; display: flex; flex-direction: column; height: fit-content; max-height: 580px; box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.02); }
        .history-header-box { padding: 20px 20px 14px 20px; font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--text-main); border-bottom: 1px solid var(--border-soft); }
        .history-search-wrapper { padding: 14px 20px; border-bottom: 1px solid var(--border-soft); }
        .history-search-wrapper input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-soft); box-sizing: border-box; font-family: inherit; outline: none; background: #f8fafc; font-size: 0.9rem; }
        .history-search-wrapper input:focus { border-color: #cbd5e1; background: #ffffff; }
        .history-scroll-deck { padding: 14px 20px; overflow-y: auto; flex: 1; }
        .compact-history-card { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: opacity 0.15s ease; }
        .compact-history-card:last-child { border-bottom: none; }
        .compact-history-card:hover { opacity: 0.7; }
        .compact-card-title { font-weight: 600; font-size: 0.92rem; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .compact-card-date { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

        footer { width: 100%; max-width: 1200px; padding: 20px 24px; box-sizing: border-box; text-align: center; border-top: 1px solid var(--border-soft); margin-top: auto; font-size: 0.76rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 6px; }
        .footer-disclaimer { font-weight: 400; line-height: 1.2; color: #64748b; }
        .footer-copyright { font-weight: 500; color: #94a3b8; }

        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; gap: 30px; } .history-column { max-height: 400px; } }
        @keyframes cardEmerging { to { opacity: 1; transform: translateY(0); } }
        @keyframes textPulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="navbar">
    <h1 onclick="goHome()">AI Dictionary</h1>
</div>

<div class="main-layout">
    
    <div id="leftWorkspace">
        
        <div class="central-container" id="homeStateView">
            <div class="welcome-phrase" id="welcomeText"></div>
            
            <div class="search-wrapper">
                <input type="text" id="aiPromptInput" placeholder="Ask words or use tools..." onkeydown="handleEnterKey(event)">
                
                <div class="media-actions">
                    <button class="input-util-btn" onclick="openCamera()" title="Capture Book Image">
                        <svg viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 8.686 5h6.628c.749 0 1.437.362 1.858.175L18.5 6.5A1.5 1.5 0 0 0 19.5 8v9a2.5 2.5 0 0 1-2.5 2.5H7A2.5 2.5 0 0 1 4.5 17V8A1.5 1.5 0 0 0 5.5 6.5l1.327-1.325z" />
                            <circle cx="12" cy="13" r="3" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>

                    <button class="input-util-btn" id="voiceTypeBtn" onclick="toggleVoiceTyping()" title="Voice Typing (Speak words)">
                        <svg viewBox="0 0 24 24">
                            <rect x="9" y="3" width="6" height="11" rx="3" stroke-linecap="round" stroke-linejoin="round"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 10v1a7 7 0 0 1-14 0v-1M12 21v-3" />
                        </svg>
                    </button>
                </div>

                <button class="logo-ai-btn" id="aiSubmitBtn" onclick="generateWithAI()" title="Submit Query">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.5228 12 22C12 16.5228 16.5228 12 22 12C16.5228 12 12 7.52285 12 2Z"/>
                    </svg>
                </button>
            </div>

            <div class="suggestions-box" id="suggestionsBox">
                <div class="suggestion-title">Suggested Modules</div>
                <div class="suggestion-tags" id="suggestionTagsDeck">
                    <div class="tag" onclick="quickFillPrompt('10 fundamental action verbs for Class 7 students')">Class 7 Verbs</div>
                    <div class="tag" onclick="quickFillPrompt('12 elementary environment and nature words')">Nature Basics</div>
                    <div class="tag" onclick="quickFillPrompt('15 essential computing and tech terms')">Computing Guide</div>
                </div>
            </div>
        </div>

        <div class="workspace-view" id="resultStateView">
            <div id="wordsGridWorkspace"></div>
        </div>

    </div>

    <div class="history-column">
        <div class="history-header-box">Study Session Logs</div>
        <div class="history-search-wrapper">
            <input type="text" id="historySearch" placeholder="Filter logs title..." oninput="renderHistory()">
        </div>
        <div class="history-scroll-deck" id="historyContent"></div>
    </div>

</div>

<div class="camera-overlay" id="cameraOverlay">
    <div class="camera-card">
        <video id="videoFeed" autoplay playsinline></video>
        <div class="camera-btn-group">
            <button class="cam-btn cam-snap" onclick="capturePhotoSnapshot()">Snap Image</button>
            <button class="cam-btn cam-cancel" onclick="closeCameraStream()">Cancel</button>
        </div>
    </div>
</div>

<div class="tooltip" id="globalTooltip"></div>

<footer>
    <div class="footer-disclaimer">AI Dictionary can make mistakes. Double-check critical information.</div>
    <div class="footer-copyright">© 2026 Meoponly — Developed with ❤️</div>
</footer>

<script>
    const apiKey = 'AIzaSyB-0QL6-2RnR8YvctO8lhf2Gy19z5hD18A';
    let localVideoStream = null;
    let voiceRecognitionEngine = null;
    let isVoiceTypingActive = false;

    const welcomeStructures = [
        `Expand your <span class="interactive-word c-blue" onmouseenter="showTooltip(this, 'Vocabulary', '(व्होकॅब्युलरी)', 'शब्दसंग्रह (Shabdasangrah)', 'All the words known and used by a person.')" onmouseleave="hideTooltip()">vocabulary</span>. Discover and learn new words every single day.`,
        `Master advanced terms <span class="interactive-word c-green" onmouseenter="showTooltip(this, 'Easily', '(इझिली)', 'सहजपणे / सोप्या पद्धतीने', 'Without a lot of hard work or extra trouble.')" onmouseleave="hideTooltip()">easily</span>. Just specify your study class or target lesson topic.`,
        `A smart learning system built to <span class="interactive-word c-purple" onmouseenter="showTooltip(this, 'Improve', '(इम्प्रूव्ह)', 'सुधारणा करणे / प्रगती करणे', 'To make something better than it was before.')" onmouseleave="hideTooltip()">improve</span> your absolute language and reading skills.`,
        `Search any topic to gather <span class="interactive-word c-orange" onmouseenter="showTooltip(this, 'Correct', '(करेक्ट)', 'अचूक / बरोबर (Achook)', 'Accurate in all details and free from mistakes.')" onmouseleave="hideTooltip()">correct</span> translations, clear pronunciations, and simple definitions.`
    ];

    // Tooltip Tracker calculations 
    function showTooltip(target, title, pronounce, meaning, definition) {
        const tooltip = document.getElementById('globalTooltip');
        tooltip.innerHTML = `<div class="tooltip-title">${title}</div><div class="tooltip-pronounce">${pronounce}</div><div class="tooltip-meaning">${meaning}</div><div>${definition}</div>`;
        tooltip.style.display = 'block';

        const targetRect = target.getBoundingClientRect();
        const tooltipRect = tooltip.getBoundingClientRect();
        const viewportWidth = window.innerWidth;

        let leftPosition = targetRect.left + (targetRect.width / 2) - (tooltipRect.width / 2);
        let topPosition = targetRect.top - tooltipRect.height - 10;

        if (leftPosition < 16) leftPosition = 16;
        else if (leftPosition + tooltipRect.width > viewportWidth - 16) leftPosition = viewportWidth - tooltipRect.width - 16;

        tooltip.style.left = `${leftPosition}px`;
        tooltip.style.top = `${topPosition}px`;
    }

    function hideTooltip() { document.getElementById('globalTooltip').style.display = 'none'; }
    function injectRandomWelcome() { document.getElementById('welcomeText').innerHTML = welcomeStructures[Math.floor(Math.random() * welcomeStructures.length)]; }

    function goHome() {
        document.getElementById('resultStateView').style.display = 'none';
        document.getElementById('homeStateView').style.display = 'flex';
        document.getElementById('aiPromptInput').value = "";
        injectRandomWelcome();
        buildSmartSuggestions();
    }

    // Live Streaming Camera capture protocols
    async function openCamera() {
        const overlay = document.getElementById('cameraOverlay');
        const video = document.getElementById('videoFeed');
        overlay.style.display = 'flex';

        try {
            localVideoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = localVideoStream;
        } catch (err) {
            console.error(err);
            alert("Unable to access camera. Check device permission protocols.");
            closeCameraStream();
        }
    }

    function closeCameraStream() {
        if (localVideoStream) {
            localVideoStream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('cameraOverlay').style.display = 'none';
    }

    function capturePhotoSnapshot() {
        // Mock capture layer logic: signals that text reading will trigger seamlessly
        alert("Image uploaded! Processing text extraction...");
        document.getElementById('aiPromptInput').value = "Extract hard vocabulary words from captured document page";
        closeCameraStream();
    }

    // Native Speech Recognition voice typing configuration engine
    function initSpeechEngine() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return null;

        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-IN'; // Configured for clear Indian English listening profile

        recognition.onresult = (event) => {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }
            if(finalTranscript) {
                document.getElementById('aiPromptInput').value += finalTranscript + ' ';
            }
        };

        recognition.onerror = () => toggleVoiceTyping();
        return recognition;
    }

    function toggleVoiceTyping() {
        if (!voiceRecognitionEngine) {
            voiceRecognitionEngine = initSpeechEngine();
            if (!voiceRecognitionEngine) return alert("Speech recognition is not supported on this browser.");
        }

        const micBtn = document.getElementById('voiceTypeBtn');
        if (isVoiceTypingActive) {
            voiceRecognitionEngine.stop();
            micBtn.classList.remove('recording');
            isVoiceTypingActive = false;
        } else {
            voiceRecognitionEngine.start();
            micBtn.classList.add('recording');
            isVoiceTypingActive = true;
        }
    }

    function quickFillPrompt(text) { document.getElementById('aiPromptInput').value = text; generateWithAI(); }
    function handleEnterKey(event) { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); generateWithAI(); } }

    async function generateWithAI() {
        const userPrompt = document.getElementById('aiPromptInput').value.trim();
        if (!userPrompt) return alert("Please specify what kind of words you need!");

        // Safely shut down voice typing if running
        if(isVoiceTypingActive) toggleVoiceTyping();

        const submitBtn = document.getElementById('aiSubmitBtn');
        submitBtn.disabled = true;
        submitBtn.classList.add('pulsing');

        const systemInstruction = `You are an integrated vocabulary data formatting API. Process the prompt and match the word count exactly.
Provide a short relevant group heading inside square brackets like [Class 7 Science] or [Verbs List].

Output everything strictly on a single line matching this precise schema layout ruleset. Do NOT include markdown blocks, speech prefix intros, or code blocks:
[Title Here] Word1*MarathiPronunciationOfEnglishWordInMarathiScript-MarathiMeaning*ShortEnglishDefinition, Word2*Pronunciation-Meaning*Definition`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: `${systemInstruction}\n\nUser Request: ${userPrompt}` }] }] })
            });

            const data = await response.json();
            const aiTextResponse = data.candidates[0].content.parts[0].text.trim();
            parseAndSaveRawData(aiTextResponse);

        } catch (error) {
            console.error(error);
            alert("Error communicating with AI engine.");
        } finally {
            submitBtn.classList.remove('pulsing');
            submitBtn.disabled = false;
        }
    }

    function parseAndSaveRawData(inputRaw) {
        let heading = "Vocabulary Session";
        let wordsDataRaw = inputRaw;

        const headingMatch = inputRaw.match(/^\[(.*?)\]/);
        if (headingMatch) {
            heading = headingMatch[1].trim();
            wordsDataRaw = inputRaw.replace(/^\[.*?\]/, '').trim();
        }

        const pairs = wordsDataRaw.split(',');
        const processedList = [];

        pairs.forEach(pair => {
            const parts = pair.split('*');
            if (parts.length >= 2) {
                const eng = parts[0].trim();
                const secondPart = parts[1];
                const dashIndex = secondPart.indexOf('-');
                
                if (dashIndex !== -1) {
                    const pronounce = secondPart.substring(0, dashIndex).trim();
                    const mar = secondPart.substring(dashIndex + 1).trim();
                    const definition = parts[2] ? parts[2].trim() : "No short definition available";
                    
                    if (eng && mar) processedList.push({ eng, pronounce, mar, definition });
                }
            }
        });

        if (processedList.length === 0) return alert("Formatting parser failure.");

        const now = new Date();
        const dateString = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
        const timeString = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

        const sessionObject = { id: Date.now(), heading, date: dateString, time: timeString, words: processedList };
        const existingHistory = JSON.parse(localStorage.getItem('vocab_history')) || [];
        existingHistory.unshift(sessionObject);
        localStorage.setItem('vocab_history', JSON.stringify(existingHistory));

        displayWorkspaceSession(sessionObject);
        renderHistory();
    }

    function displayWorkspaceSession(session) {
        document.getElementById('homeStateView').style.display = 'none';
        const resultView = document.getElementById('resultStateView');
        resultView.style.display = 'block';

        const workspace = document.getElementById('wordsGridWorkspace');
        let gridHTML = `<div class="session-heading"><div class="session-title-tag"><span style="font-weight:700; color:var(--accent-color);">⚡</span><span>${session.heading}</span></div><small style="font-size:0.88rem; color:var(--text-muted); font-weight:600; background:#ffffff; border:1px solid var(--border-soft); padding:4px 10px; border-radius:12px;">🕒 ${session.time}</small></div><div class="vocab-grid">`;

        session.words.forEach((item, index) => {
            gridHTML += `<div class="vocab-card" style="animation-delay: ${index * 0.03}s;"><div class="word-info"><div class="main-translation-row"><span class="word-number">${index + 1}.</span><span>${item.eng}</span><span style="color:#cbd5e1; font-weight:400; margin: 0 2px;">-</span><span class="translation-text">${item.mar}</span></div>${item.pronounce ? `<div class="pronunciation-row">(${item.pronounce})</div>` : ''}<div class="definition-row">${item.definition}</div></div><button class="speak-btn" onclick="speakWord('${item.eng.replace(/'/g, "\\'")}')" title="Listen Audio"><svg viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-3 0L6 7H2v10h4l5 3.77V3.23z"/></svg></button></div>`;
        });

        gridHTML += `</div>`;
        workspace.innerHTML = gridHTML;
    }

    function speakWord(word) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        const voices = window.speechSynthesis.getVoices();
        const indianVoice = voices.find(v => v.lang === 'en-IN' || v.name.includes('India'));
        if (indianVoice) utterance.voice = indianVoice;
        else utterance.lang = 'en-IN';
        utterance.volume = 1.0; utterance.rate = 0.85; utterance.pitch = 0.95;
        window.speechSynthesis.speak(utterance);
    }

    function buildSmartSuggestions() {
        const historyData = JSON.parse(localStorage.getItem('vocab_history')) || [];
        const tagsDeck = document.getElementById('suggestionTagsDeck');
        if (historyData.length === 0) {
            tagsDeck.innerHTML = `<div class="tag" onclick="quickFillPrompt('10 fundamental action verbs for Class 7 students')">Class 7 Verbs</div><div class="tag" onclick="quickFillPrompt('12 elementary environment and nature words')">Nature Basics</div><div class="tag" onclick="quickFillPrompt('15 essential computing and tech terms')">Computing Guide</div>`;
            return;
        }
        const uniqueHeadings = [...new Set(historyData.map(s => s.heading))].slice(0, 4);
        let tagsHTML = "";
        uniqueHeadings.forEach(heading => { tagsHTML += `<div class="tag" onclick="quickFillPrompt('Give me a new set of words similar to ${heading}')">Review ${heading}</div>`; });
        tagsHTML += `<div class="tag" onclick="quickFillPrompt('15 intermediate random challenge words')">Surprise Me!</div>`;
        tagsDeck.innerHTML = tagsHTML;
    }

    function renderHistory() {
        const historyContent = document.getElementById('historyContent');
        const searchTerm = document.getElementById('historySearch').value.toLowerCase();
        const historyData = JSON.parse(localStorage.getItem('vocab_history')) || [];
        if (historyData.length === 0) { historyContent.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; margin-top:20px;">No logs recorded.</p>`; return; }
        let htmlOutput = "";
        historyData.forEach(session => { if (session.heading.toLowerCase().includes(searchTerm)) { htmlOutput += `<div class="compact-history-card" onclick="loadSessionFromHistory(${session.id})"><div class="compact-card-title">${session.heading}</div><div class="compact-card-date">${session.date}</div></div>`; } });
        historyContent.innerHTML = htmlOutput || `<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; margin-top:20px;">No matches.</p>`;
    }

    // Quick history loading sequence
    function loadSessionFromHistory(id) {
        const historyData = JSON.parse(localStorage.getItem('vocab_history')) || [];
        const session = historyData.find(s => s.id === id);
        if(session) displayWorkspaceSession(session);
    }

    window.onload = function() {
        injectRandomWelcome();
        buildSmartSuggestions();
        renderHistory();
        
        document.getElementById('resultStateView').style.display = 'none';
        document.getElementById('homeStateView').style.display = 'flex';
    }
</script>

</body>
</html>
